name: Cleanup old Actions runs 2026-09-07

on:
  push:
    branches:
      - cleanup-actions-20260907

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Keep only latest Challenge Room Server run
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_IDS: "33894735589"
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_ID="${{ github.run_id }}"
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" --jq '.workflow_runs[].id' > /tmp/run_ids.txt
          while read -r id; do
            [ -z "$id" ] && continue
            case " ${KEEP_IDS} ${CURRENT_ID} " in
              *" ${id} "*) echo "KEEP ${id}" ;;
              *) echo "DELETE ${id}"; gh api -X DELETE "/repos/${GITHUB_REPOSITORY}/actions/runs/${id}" ;;
            esac
          done < /tmp/run_ids.txt
          gh api -X DELETE "/repos/${GITHUB_REPOSITORY}/actions/runs/${CURRENT_ID}" || true
