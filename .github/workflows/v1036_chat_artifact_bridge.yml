name: V1036 Chat Artifact Bridge
on:
  push:
    branches: [temp-v1036-chat-delivery]
    paths:
      - '.github/workflows/v1036_chat_artifact_bridge.yml'
permissions:
  contents: read
jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Temp.sh landing page links
        shell: bash
        run: |
          set -euo pipefail
          URL='https://temp.sh/sGkpS/AB_Tahadani_Learn_V1.0.36_ATTENDANCE_FAMILY_UI_SAFE.apk'
          curl --fail --location --silent --show-error "$URL" -o /tmp/page.html
          echo '--- LINKS ---'
          grep -Eo 'https?://[^"<> ]+|href="[^"]+"' /tmp/page.html || true
          echo '--- HTML ---'
          cat /tmp/page.html
